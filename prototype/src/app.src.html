<title>AI Discovery World 原型</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: graph-paper workbench. A sticky top bar switches between four roles; the child view sits inside a tablet frame. */
:root{
  --bg:#eef2f7; --surface:#ffffff; --surface-2:#f6f8fb; --ink:#16213a; --muted:#5a6578; --line:#d6dde8;
  --grid:rgba(37,87,214,.07); --accent:#2557d6; --accent-ink:#ffffff; --accent-soft:#e3ebff;
  --mark:#e9821c; --mark-soft:#fff1e2; --good:#1d8657; --good-soft:#e2f4ea; --warn:#a86b0f; --warn-soft:#fff4dc;
  --bad:#c03b35; --bad-soft:#fde8e6; --zh:#c03b35; --en:#2557d6; --scene:#e7edf6; --pad:#1b2233;
  --f-display:"ZCOOL KuaiLe","Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  --f-body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e131d; --surface:#161d2b; --surface-2:#1c2434; --ink:#e5eaf3; --muted:#97a2b6; --line:#2a3447;
  --grid:rgba(111,148,255,.07); --accent:#7097ff; --accent-ink:#0b1020; --accent-soft:#1d2b4f;
  --mark:#ffa04a; --mark-soft:#3a2a17; --good:#4cc68c; --good-soft:#163527; --warn:#e9b04f; --warn-soft:#382b12;
  --bad:#ff7a72; --bad-soft:#3d1c1b; --zh:#ff7a72; --en:#7097ff; --scene:#1a2232; --pad:#05070b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e131d; --surface:#161d2b; --surface-2:#1c2434; --ink:#e5eaf3; --muted:#97a2b6; --line:#2a3447;
  --grid:rgba(111,148,255,.07); --accent:#7097ff; --accent-ink:#0b1020; --accent-soft:#1d2b4f;
  --mark:#ffa04a; --mark-soft:#3a2a17; --good:#4cc68c; --good-soft:#163527; --warn:#e9b04f; --warn-soft:#382b12;
  --bad:#ff7a72; --bad-soft:#3d1c1b; --zh:#ff7a72; --en:#7097ff; --scene:#1a2232; --pad:#05070b; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.6;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-size:12px}
.tnum{font-variant-numeric:tabular-nums}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.3}
p{margin:0}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
.top-in{max-width:1280px;margin:0 auto;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center}
.brand{display:flex;align-items:baseline;gap:10px}
.brand b{font-family:var(--f-display);font-size:20px;font-weight:400;letter-spacing:.02em}
.brand span{color:var(--muted);font-size:12px}
.roles{display:flex;gap:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;flex-wrap:wrap}
.roles button{border:0;background:transparent;padding:6px 12px;border-radius:7px;font-weight:500;color:var(--muted)}
.roles button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.clock{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:12px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.mark{background:var(--mark);border-color:var(--mark);color:#1b1206}
.btn.ghost{background:transparent}
.btn.sm{padding:3px 9px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:1280px;margin:0 auto}
.view-head{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;margin-bottom:14px}
.view-head h2{font-size:20px}
.view-head p{color:var(--muted);max-width:70ch}
.fr{display:inline-block;font-family:var(--f-mono);font-size:10.5px;padding:0 5px;border-radius:4px;border:1px solid var(--line);color:var(--muted);background:var(--surface-2);vertical-align:middle;white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:1px 8px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
.chip.good{background:var(--good-soft);border-color:transparent;color:var(--good)}
.chip.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.chip.bad{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.chip.acc{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.chip.mk{background:var(--mark-soft);border-color:transparent;color:var(--mark)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.panel h3{font-size:15px;margin-bottom:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted)}
.small{font-size:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:10px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--muted);font-size:12px;white-space:nowrap}
.note{border-left:3px solid var(--mark);background:var(--mark-soft);padding:8px 12px;border-radius:0 8px 8px 0;font-size:13px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:9px;z-index:50;font-size:13px;max-width:min(90vw,520px)}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
label.f input,label.f select,label.f textarea{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:6px 8px;font-size:13px;color:var(--ink)}
.subtabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.subtabs button{border:0;background:transparent;padding:8px 12px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;font-weight:500}
.subtabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}

/* child tablet */
.child-layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
@media (max-width:1000px){.child-layout{grid-template-columns:1fr}}
.pad{background:var(--pad);border-radius:28px;padding:14px;box-shadow:0 18px 40px rgba(10,20,40,.18)}
.screen{background:var(--surface-2);border-radius:16px;overflow:hidden;min-height:620px;display:flex;flex-direction:column;position:relative}
.sbar{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:8px 14px;background:var(--surface);border-bottom:1px solid var(--line);font-size:12px;flex-wrap:wrap}
.sbody{padding:16px;flex:1;display:flex;flex-direction:column;gap:14px;min-width:0}
.kid h1,.kid h2,.kid .disp{font-family:var(--f-display);font-weight:400;letter-spacing:.02em}
.pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.pick button{border:2px solid var(--line);background:var(--surface);border-radius:16px;padding:22px;text-align:left;display:flex;flex-direction:column;gap:6px}
.pick button:hover{border-color:var(--accent)}
.pick .ava{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-size:24px;background:var(--accent-soft);color:var(--accent)}
.pick .ava.m{background:var(--mark-soft);color:var(--mark)}
.today{background:var(--surface);border:2px solid var(--accent);border-radius:16px;padding:18px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center}
@media (max-width:560px){.today{grid-template-columns:1fr}}
.today h2{font-size:22px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.tile h3{font-size:14px}
.lockrow{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:6px 0;border-top:1px dashed var(--line);font-size:13px;flex-wrap:wrap}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.steps span{font-size:12px;padding:3px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.steps span.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.steps span.done{color:var(--good);border-color:var(--good)}
.lesson-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.pending-card{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:rgba(15,23,32,.82);color:#fff;border-radius:10px;padding:8px 14px;font-size:13px;line-height:1.5;max-width:78%;text-align:center;pointer-events:none}
.stage{position:relative;border-radius:12px;overflow:hidden;background:#9fb0a0;aspect-ratio:16/10;max-width:100%;touch-action:none;user-select:none}
.stage canvas{display:block;width:100%;height:100%}
.hs{position:absolute;transform:translate(-50%,-50%);border:1px solid rgba(255,255,255,.55);background:rgba(12,16,24,.62);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:#fff;border-radius:6px;padding:3px 9px 3px 20px;font-size:12px;font-weight:500;white-space:nowrap}
.hs::before{content:"";position:absolute;left:8px;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;background:#ffd166;box-shadow:0 0 0 3px rgba(255,209,102,.25)}
.loading3d{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:13px}
.hs.dim{background:var(--surface);color:var(--ink);border-color:var(--line);font-weight:500}
.dimlab{position:absolute;transform:translate(-50%,-50%);font-family:var(--f-mono);font-size:11px;background:rgba(255,255,255,.85);color:#16213a;padding:0 5px;border-radius:4px;pointer-events:none;opacity:.92}
.stage-tools{position:absolute;left:10px;top:10px;display:flex;flex-direction:column;gap:6px}
.stage-tools button{width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-size:15px}
.badge-sim{position:absolute;right:10px;top:10px;font-size:11px;background:var(--surface);border:1px solid var(--line);padding:2px 8px;border-radius:6px}
.sub{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);width:min(92%,560px);background:rgba(10,15,25,.82);color:#fff;border-radius:10px;padding:8px 12px;font-size:13px}
.sub .tag{font-size:11px;padding:0 6px;border-radius:4px;margin-right:6px;background:#fff;color:#111}
.demo-grid{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:12px}
@media (max-width:820px){.demo-grid{grid-template-columns:1fr}}
.ctrl{display:flex;flex-direction:column;gap:10px}
.ctrl .slider{display:flex;flex-direction:column;gap:2px}
.ctrl .slider div{display:flex;justify-content:space-between}
.ctrl input[type=range]{width:100%;accent-color:var(--accent)}
.formula{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:13px}
.formula .big{font-family:var(--f-mono);font-size:16px;font-weight:600}
.alt{display:flex;flex-wrap:wrap;gap:6px}
.lang{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.lang select{border:1px solid var(--line);border-radius:7px;padding:3px 6px;background:var(--surface);font-size:12px}
.dots{display:inline-flex;gap:3px;vertical-align:middle}
.dots i{width:16px;height:16px;border-radius:4px;font-style:normal;font-size:10px;display:grid;place-items:center;border:1px solid var(--line);color:var(--muted)}
.dots i.zh{color:var(--zh)} .dots i.en{color:var(--en)}
.dots i.next{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.q{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}
.q input.ans{width:64px;border:1px solid var(--line);border-radius:7px;padding:4px 6px;text-align:center;background:var(--surface-2)}
.opt{display:flex;gap:8px;flex-wrap:wrap}
.opt button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px}
.opt button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.side .panel{margin-bottom:12px}
.log{max-height:220px;overflow:auto;font-family:var(--f-mono);font-size:11px;display:flex;flex-direction:column;gap:2px}
.log div{padding:2px 0;border-bottom:1px dashed var(--line)}
.overlay{position:absolute;inset:0;background:rgba(10,15,25,.45);display:grid;place-items:center;z-index:5;padding:16px}
.dialog{background:var(--surface);border-radius:14px;padding:18px;max-width:380px;display:flex;flex-direction:column;gap:10px}

/* studio */
.studio{display:grid;grid-template-columns:250px minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:860px){.studio{grid-template-columns:1fr}}
.pipe{display:flex;flex-direction:column;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.pipe button{display:grid;grid-template-columns:26px 1fr auto;gap:8px;align-items:center;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:10px 12px}
.pipe button:last-child{border-bottom:0}
.pipe button[aria-selected="true"]{background:var(--accent-soft)}
.pipe .n{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;border:1.5px solid var(--line)}
.pipe .ok .n{background:var(--good);border-color:var(--good);color:#fff}
.pipe .fail .n{background:var(--bad);border-color:var(--bad);color:#fff}
.pipe .run .n{border-color:var(--accent);color:var(--accent)}
pre.json{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:12px;overflow:auto;max-height:520px;font-family:var(--f-mono);font-size:11.5px;line-height:1.5;margin:0}
.statebar{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:12px}
.statebar span{font-size:11px;padding:2px 8px;border-radius:6px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.statebar span.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.statebar span.past{color:var(--good);border-color:var(--good)}
.rule{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:13px}
.rule .ic{font-weight:700}
.hw{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:14px}
@media (max-width:860px){.hw{grid-template-columns:1fr}}
.photo{background:#fbfaf4;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.photo svg{display:block;width:100%;height:auto}
.judg{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.judg .cell{border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--surface-2)}
.judg .cell h4{margin:0 0 4px;font-size:13px}
.srcgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.src{border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--surface-2);display:flex;flex-direction:column;gap:4px}
.consent{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 12px;align-items:start;padding:8px 0;border-bottom:1px solid var(--line)}
textarea.card{width:100%;min-height:200px;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--surface-2);font-size:13px;line-height:1.7}
@media (max-width:640px){.top{position:static}.brand span{display:none}.roles button{padding:5px 9px}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

<header class="top">
  <div class="top-in">
    <div class="brand"><b>AI Discovery World</b><span>可交互系统原型 · 对应 PRD V1.1 + 审计修正</span></div>
    <nav class="roles" role="tablist" aria-label="角色">
      <button role="tab" data-view="child" id="tab-child">儿童端 Pad</button>
      <button role="tab" data-view="parent" id="tab-parent">家长端</button>
      <button role="tab" data-view="studio" id="tab-studio">Skill 制作台</button>
      <button role="tab" data-view="spec" id="tab-spec">规格对照</button>
    </nav>
    <div class="clock"><span>服务器日期 <b class="tnum" id="srvDate"></b> · Asia/Shanghai</span>
      <button class="btn sm" id="nextDay" title="FR55：跨日先保存再锁定">模拟跨日</button>
      <button class="btn sm ghost" id="resetAll">重置原型</button></div>
  </div>
</header>
<main><div class="wrap" id="app"></div></main>

<script>
/* ============ data ============ */
const BASE_DATE = new Date('2026-10-24T00:00:00+08:00');
const CHILDREN = {
  gege:{id:'gege',name:'哥哥',grade:'小学四年级',gradeN:4,ava:'哥',mins:'10–15 分钟',scaffold:'快速进入挑战 · 短提示 · 允许自由实验并说明理由'},
  meimei:{id:'meimei',name:'妹妹',grade:'小学二年级',gradeN:2,ava:'妹',mins:'8–10 分钟',scaffold:'具体实物 · 小步演示 · 可重复操作 · 留出等待时间'}
};
const HOTSPOTS = {
  ArrayMultiplier:[
    {id:'row',label:'行',teaches:'MC.mul_as_repeated_groups',zh:'这是一行。每一行的方块一样多，所以可以一行一行地加。',en:['This is a row. Every row has the same number of blocks.','row — 行。One row, two rows, three rows.','Tap “加一行” to add one more row.']},
    {id:'col',label:'列',teaches:'MC.commutative_array',zh:'这是一列。竖着看，也能数出一样的总数。',en:['This is a column. Count down the column.','column — 列。','Turn the blocks and count the columns again.']},
    {id:'total',label:'总数',teaches:'MC.mul_as_repeated_groups',zh:'一共有多少块？可以一个一个数，也可以用乘法：行数乘每行的个数。',en:['How many blocks in all? Rows times blocks in each row.','in all — 一共。','Say the multiplication out loud.']}
  ],
  Reef:[
    {id:'fence',label:'卷尺',teaches:'MC.perim_area_swap',zh:'调查员沿着调查区的边拉一圈卷尺。拉一圈用了多少米，就是周长，单位是米。',en:['The tape goes all the way around the survey area. Its length is the perimeter.','perimeter — 周长。','Pull the tape around the edge.']},

let speaking=null;
function lkey(h){const s=sess(),L=lessonByKey(s.lessonKey);return `${S.child}|${L.id}@${L.ver}|${h.id}|rev1`}
function playHotspot(h,override){
  const L=S.lang[S.child],key=lkey(h);
  if(speaking&&speaking.key===key&&!override){toast('正在播放，重复点击不计数');return}
  let lang='zh',idx=0,advance=false,p=S.pointers[key]||0;
  if(override)lang=override;
  else if(L.mode==='cycle'){const pos=p%4;lang=pos===0?'zh':'en';idx=pos-1;advance=true}
  else lang=L.mode==='en'?'en':L.mode==='bi'?'bi':'zh';
  let text=lang==='zh'?h.zh:lang==='en'?(h.en[idx]||null):h.zh+' / '+h.en[0];
  let note='';
  if(lang==='en'&&!text){text=h.zh;lang='zh';note='这条暂时没有英文，先用中文。'}
  const sess_=sess();
  const show=()=>{const st=document.getElementById('stage');if(!st)return;let sub=st.querySelector('.sub');if(!sub){sub=document.createElement('div');sub.className='sub';st.appendChild(sub)}
    sub.innerHTML=`<span class="tag">${lang==='zh'?'中':lang==='en'?'EN':'中/EN'}</span>${esc(text)}${note?` <span style="opacity:.7">(${note})</span>`:''}`};
  const started=()=>{if(advance){S.pointers[key]=p+1}sess_.log.push(`${now()} 热点 ${h.id} 播放 ${lang}${advance?` · 循环第 ${p+1} 次`:override?' · 手动覆盖，不推进':''}`);show();updateLangPanel()};
  if(S.failAudio){sess_.log.push(`${now()} 热点 ${h.id} 音频加载失败，未计数`);toast('音频没加载出来，这次不计数。可以看字幕或再点一次。');updateLangPanel();return}
  speaking={key};
  if(L.muted||!('speechSynthesis' in window)){started();setTimeout(()=>{if(speaking&&speaking.key===key)speaking=null},1500);return}
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang=lang==='en'?'en-US':'zh-CN';u.rate=L.rate;let fired=false;
    u.onstart=()=>{fired=true;started()};u.onend=()=>{speaking=null};u.onerror=()=>{speaking=null;if(!fired){sess_.log.push(`${now()} 语音引擎不可用，以字幕播放`);started()}};
    speechSynthesis.speak(u);setTimeout(()=>{if(!fired&&speaking&&speaking.key===key){fired=true;started();setTimeout(()=>{speaking=null},1200)}},900)}catch(e){started();speaking=null}
}

function stSchema(el){
  const schema={$schema:'https://json-schema.org/draft/2020-12/schema',title:'LessonSpec',type:'object',
    required:['schema_version','lesson_id','version','primary_concept','prerequisites','curriculum_mapping','learner_profile','child_path','object_asset_versions','scene_component_ids','experiment_model_version','activity_graph','hotspots','assessment_plan','source_refs','safety_review','review_records'],
    properties:{
      primary_concept:{type:'object',required:['id','name','target_misconceptions'],properties:{id:{type:'string'},target_misconceptions:{type:'array',minItems:1,items:{type:'string',pattern:'^MC\\.'}}}},
      curriculum_mapping:{type:'object',required:['region','system','grade','source','status'],properties:{status:{enum:['已核对本年级','先修补强','兴趣拓展','待核对']},verified_by:{type:['string','null']}}},
      object_asset_versions:{type:'array',items:{type:'object',required:['asset_id','ver','license','commercial_ok','source','depiction'],properties:{commercial_ok:{type:'boolean'}}}},
      distribution:{type:'object',required:['scope','tenant_id'],properties:{scope:{enum:['family','commercial']},tenant_id:{type:'string',description:'为未来多家庭预留，家用阶段只有一个'}}},
      learner_profile:{type:'object',description:'去标识：不得包含姓名、学校、原图',additionalProperties:false,properties:{grade:{type:'integer'},scaffold:{type:'array'},language:{type:'object'},recent_judgment_ref:{type:['string','null']}}},
      scene_component_ids:{type:'array',items:{type:'string',pattern:'^[A-Za-z]+@\\d+\\.\\d+$'},description:'只能引用组件库中已审核的组件'},
      experiment_model_version:{type:'object',required:['id','ver','deterministic','vars','outputs','reference_cases'],properties:{deterministic:{const:true},reference_cases:{type:'array',minItems:3}}},
      activity_graph:{type:'array',items:{type:'object',required:['id','type','teaches'],properties:{type:{enum:['explain','contrast','build','simulate','predict','transfer']},teaches:{type:'string',minLength:1},hints:{type:'array'},complete:{type:'string'}}}},
      hotspots:{type:'array',items:{type:'object',required:['id','teaches','language_pack'],properties:{teaches:{type:'string',minLength:1},language_pack:{type:'object',required:['zh','en'],properties:{zh:{type:'string',minLength:1},en:{type:'array',maxItems:3,description:'解释 / 关键词 / 操作任务；缺失时回落中文'}}}}}},
      assessment_plan:{type:'object',properties:{states:{const:['未观察','待确认','有独立应用证据','需再支持']}}}}};
  el.innerHTML=`<div class="grid2"><div class="panel"><h3>LessonSpec JSON Schema（节选）<span class="fr">S3</span></h3><pre class="json">${esc(JSON.stringify(schema,null,2))}</pre></div>
   <div class="panel"><h3>相对 PRD V1.1 的补充</h3><ul class="small" style="padding-left:18px;margin:0;display:flex;flex-direction:column;gap:6px">
    <li><b>learner_profile</b> 替代“孩子”输入，去标识。<span class="fr">S8</span></li>
    <li><b>target_misconceptions</b> 必填，引用误区库。<span class="fr">S5</span></li>
    <li><b>teaches</b> 在每个节点和热点上必填，落实 BL02。<span class="fr">S6</span></li>
    <li><b>experiment_model_version</b> 定义变量、单位、公式和至少 3 个参考算例。<span class="fr">S4</span></li>
    <li><b>hotspots[].language_pack</b> 固定为 1 条中文 + 最多 3 条英文。<span class="fr">S9</span></li>
    <li><b>commercial_ok</b> 和 <b>distribution.scope</b>：家用先行、预留商用。商用发布时自动拦截仅家用素材。</li>
    <li><b>tenant_id</b>：所有记录预留家庭标识，以后扩成多家庭时不用迁移数据结构。</li>
    <li><b>LessonVersion</b> = 已发布的 LessonSpec + 包哈希 + 审核记录，统一用 version 一个版本字段。</li></ul></div></div>`;
}
function stHw(el){
  const contract={name:'homework-evidence-analyzer',input:{child_ref:'不透明 ID，不含姓名',subject:'数学',material_type:['作业','试卷','成绩单','错题'],images:'已遮盖的私有链接，短期签名',curriculum_ref:'可选'},
    output:{items:[{n:1,stem:'…',answer:'…',mark:'✓|✗|?',bbox:[0,0,0,0],confidence:'高|中|低',needs_confirm:true}],
      judgment:{observed:['…'],hypotheses:[{misconception:'MC.…',evidence_items:[2],status:'待验证'}],alternatives:['…'],unknowns:['…'],next_lesson:{keep_concept:true,change_representation:'…'},probe_task:'…'}},
    rules:['关键字段未核对 → 不输出 judgment','只有总分 → 只给整体描述，不给题级弱项','不输出能力百分比、心理或人格推断','家长修正生成新修订，不覆盖原图']};
  el.innerHTML=`<div class="grid2"><div class="panel"><h3>第二个 Skill：作业证据分析 <span class="fr">FR18–22</span> <span class="fr">S7</span></h3><p class="small muted">建议和制作 Skill 分开。它的输出 judgment 会作为制作 Skill 第 1 阶段的输入，两者共用误区库。</p><pre class="json" style="margin-top:8px">${esc(JSON.stringify(contract,null,2))}</pre></div>
   <div class="panel"><h3>闭环</h3><ol class="small" style="padding-left:18px;margin:0;display:flex;flex-direction:column;gap:6px">
   <li>家长在家长端拍作业 → 作业分析 Skill 识别</li><li>家长核对关键字段 → 生成 LearningJudgment（待验证）</li><li>制作 Skill 以 judgment 为输入 → 目标不变、换表征</li><li>自动校验 + 家长审核 → 发布新版本</li><li>家长安排 → 孩子在 Pad 上学 → 下一次作业验证</li></ol>
   <p class="small muted" style="margin-top:10px">在原型里可以完整走一遍：家长端 → 作业反馈 → “用这个判断生成下一课”。</p></div></div>`;
}
