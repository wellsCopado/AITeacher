<h1>四年级数学 · 周长与面积 练习</h1><div class="meta">姓名：哥哥　　日期：10 月 23 日</div>
<div class="q">1. 一个长方形长 5 厘米、宽 3 厘米，周长是多少？<span class="ans">（5+3）×2 = 16 厘米</span><span class="mark">✓</span></div>
<div class="q">2. 一个长方形花坛长 6 米、宽 4 米，面积是多少？<span class="ans">6×4 = 24 米</span><span class="mark">✗</span><span class="note">单位？</span></div>
<div class="q">3. 正方形边长 3 分米，面积是多少？<span class="ans">3×3 = 9 平方分米</span><span class="mark">✓</span></div>
<div class="q">4. 用 12 米长的篱笆围一个长方形菜地，长 4 米，宽是多少米？<span class="ans">12÷2−4 = 2 米</span><span class="mark">✓</span></div>
